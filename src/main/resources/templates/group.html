<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: base(~{::title}, ~{::body})}">
<head>
    <title th:text="'Группа · ' + ${group.name}">Группа</title>
</head>
<body>
<section class="page-section">
    <div class="org-summary">
        <div>
            <h1 th:text="${group.name}">Название группы</h1>
            <p class="muted" th:text="${group.description != null ? group.description : 'Описание отсутствует'}"></p>
        </div>
    </div>

</section>

<section class="page-section">
    <div class="filters-card">
        <div class="filter-controls">
            <label>
                Поиск по названию
                <input type="text" id="product-search" placeholder="Например, «набор»"/>
            </label>
            <label>
                Сортировка
                <select id="product-sort">
                    <option value="newest">Сначала новые</option>
                    <option value="oldest">Сначала старые</option>
                    <option value="name">По алфавиту</option>
                </select>
            </label>
            <button class="btn secondary" type="button" id="reset-filters">Сбросить</button>
        </div>
    </div>

    <div class="product-grid" th:if="${products != null and !products.isEmpty()}">
        <article class="product-card"
                 th:each="product : ${products}"
                 th:data-name-search="${product.name != null ? product.name.toLowerCase() : ''}"
                 th:data-name="${product.name != null ? product.name : 'Продукт'}"
                 th:data-description-search="${product.description != null ? product.description.toLowerCase() : ''}"
                 th:data-description="${product.description != null ? product.description : 'Описание отсутствует'}"
                 th:data-created="${product.createdAt != null ? #temporals.format(product.createdAt, 'yyyy-MM-dd''T''HH:mm:ss') : ''}"
                 th:data-image="${product.imageUrl != null ? product.imageUrl : ''}">
            <div class="product-image" th:with="imageUrl=${product.imageUrl}">
                <img th:if="${imageUrl != null}"
                     th:src="${imageUrl}"
                     alt=""
                     loading="lazy"
                     style="width: auto; height: auto; max-width: 100%; max-height: 300px; object-fit: contain;"/>
                <img th:if="${imageUrl == null}"
                     th:src="@{/img/product-placeholder.svg}"
                     alt=""
                     loading="lazy"
                     style="width: auto; height: auto; max-width: 100%; max-height: 300px; object-fit: contain;"/>
            </div>
            <div class="product-card-body">
                <div class="product-card-header">
                    <h3 th:text="${product.name}">Название продукта</h3>
                </div>
                <div class="product-details" hidden>
                    <ul th:if="${product.details != null and !product.details.isEmpty()}">
                        <li th:each="entry : ${product.details}">
                            <span class="detail-key" th:text="${entry.key}"></span>
                            <span class="detail-value" th:text="${entry.value}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </article>
    </div>
    <div class="empty-state" id="filter-empty" hidden>
        <p>По выбранным фильтрам ничего не найдено. Измените условия и попробуйте снова.</p>
    </div>
    <div class="empty-state" th:if="${products == null or products.isEmpty()}">
        <p>В этой группе пока нет продуктов. Добавьте их ниже или создайте новые.</p>
    </div>

</section>

<script th:inline="javascript">
    (function initGroupPage() {
        const init = () => {
            const cards = Array.from(document.querySelectorAll('.product-card'));
            const grid = document.querySelector('.product-grid');
            const searchInput = document.getElementById('product-search');
            const sortSelect = document.getElementById('product-sort');
            const resetBtn = document.getElementById('reset-filters');
            const placeholderImage = /*[[ @{/img/product-placeholder.svg} ]]*/ '/img/product-placeholder.svg';

            let modal;
            let modalImage;
            let modalTitle;
            let modalDescription;
            let modalDetails;
            let modalDetailsContent;

            const escapeHtml = (unsafe = '') =>
            unsafe.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

            function ensureModal() {
                if (modal) {
                    return;
                }

                modal = document.createElement('div');
                modal.className = 'product-modal';
                modal.id = 'product-modal';
                modal.style.display = 'none';
                modal.innerHTML = `
                    <div class="product-modal__backdrop" data-modal-close></div>
                    <div class="product-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
                        <button class="icon-button product-modal__close" type="button" data-modal-close>×</button>
                        <div class="product-modal__body">
                            <div class="product-modal__media">
                                <img class="product-modal__image"
                                     alt=""
                                     style="max-width: 90vw; max-height: 80vh; width: auto; height: auto; object-fit: contain;"/>
                            </div>
                            <div class="product-modal__info">
                                <h3 id="product-modal-title"></h3>
                                <p class="muted" id="product-modal-description"></p>
                            </div>
                        </div>
                        <div class="product-modal__details" id="product-modal-details" style="display: none">
                            <h4>Характеристики</h4>
                            <div class="product-modal__details-list" id="product-modal-details-content"></div>
                        </div>
                    </div>`;

                document.body.appendChild(modal);

                modalImage = modal.querySelector('.product-modal__image');
                modalTitle = modal.querySelector('#product-modal-title');
                modalDescription = modal.querySelector('#product-modal-description');
                modalDetails = modal.querySelector('#product-modal-details');
                modalDetailsContent = modal.querySelector('#product-modal-details-content');

                modal.addEventListener('click', (event) => {
                    if (event.target.classList.contains('product-modal__backdrop') ||
                    event.target.closest('[data-modal-close]') ||
                    event.target.classList.contains('product-modal__close')) {
                        closeModal();
                    }
                });

                const closeButton = modal.querySelector('.product-modal__close');
                if (closeButton) {
                    closeButton.addEventListener('click', (event) => {
                        event.stopPropagation();
                        closeModal();
                    });
                }

                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape' && modal.style.display !== 'none') {
                        closeModal();
                    }
                });
            }

            function applyFilters() {
                const query = (searchInput?.value || '').trim().toLowerCase();
                const sort = sortSelect?.value || 'newest';

                cards.forEach(card => {
                    const name = card.dataset.nameSearch || '';
                    const description = card.dataset.descriptionSearch || '';
                    const matches = !query || name.includes(query) || description.includes(query);
                    card.style.display = matches ? '' : 'none';
                });

                const visibleCards = cards.filter(card => card.style.display !== 'none');
                if (grid) {
                    const sorted = [...visibleCards].sort((a, b) => {
                        switch (sort) {
                            case 'name':
                                return (a.dataset.name || '').localeCompare(b.dataset.name || '');
                            case 'oldest':
                                return (a.dataset.created || '').localeCompare(b.dataset.created || '');
                            case 'newest':
                            default:
                                return (b.dataset.created || '').localeCompare(a.dataset.created || '');
                        }
                    });
                    sorted.forEach(card => grid.appendChild(card));
                    const filterEmpty = document.getElementById('filter-empty');
                    if (filterEmpty) {
                        filterEmpty.hidden = visibleCards.length !== 0;
                    }
                }
            }

            function fillModalFromCard(card) {
                ensureModal();

                const title = card.dataset.name || 'Продукт';
                const description = card.dataset.description || '';
                const imageSrc = card.dataset.image || placeholderImage;

                modalTitle.textContent = title;
                modalDescription.textContent = description;
                modalDescription.style.display = description ? 'block' : 'none';

                // Загружаем изображение в его истинном размере
                if (imageSrc) {
                    const img = new Image();
                    img.onload = function() {
                        modalImage.src = imageSrc;
                        modalImage.alt = title;

                        // Можно добавить информацию о размере изображения если нужно
                        console.log(`Original image size: ${this.naturalWidth}x${this.naturalHeight}`);
                    };
                    img.onerror = function() {
                        modalImage.src = placeholderImage;
                        modalImage.alt = 'Изображение не найдено';
                    };
                    img.src = imageSrc;
                } else {
                    modalImage.src = placeholderImage;
                    modalImage.alt = title;
                }

                const detailItems = Array.from(card.querySelectorAll('.product-details li'))
                    .map(li => ({
                    key: li.querySelector('.detail-key')?.textContent?.trim() || '',
                    value: li.querySelector('.detail-value')?.textContent?.trim() || ''
                }))
                    .filter(item => item.key || item.value);

                if (detailItems.length) {
                    modalDetailsContent.innerHTML = detailItems.map(item => `
                        <div class="product-modal__details-item">
                            <span class="details-item__key">${escapeHtml(item.key)}:</span>
                            <span class="details-item__value">${escapeHtml(item.value)}</span>
                        </div>
                    `).join('');
                    modalDetails.style.display = 'block';
                } else {
                    modalDetailsContent.innerHTML = '';
                    modalDetails.style.display = 'none';
                }
            }

            function openModal(card) {
                ensureModal();
                fillModalFromCard(card);
                modal.style.display = 'flex';
                document.body.classList.add('modal-open');
            }

            function closeModal() {
                if (!modal) {
                    return;
                }
                modal.style.display = 'none';
                document.body.classList.remove('modal-open');
            }

            searchInput?.addEventListener('input', applyFilters);
            sortSelect?.addEventListener('change', applyFilters);
            resetBtn?.addEventListener('click', () => {
                if (searchInput) searchInput.value = '';
                if (sortSelect) sortSelect.value = 'newest';
                applyFilters();
            });

            function isInteractiveTarget(target) {
                if (!target) return false;
                const element = target instanceof Element ? target : target.parentElement;
                return element?.closest('button, a, input, select, textarea');
            }

            cards.forEach(card => {
                card.style.cursor = 'pointer';
                card.addEventListener('click', (event) => {
                    if (isInteractiveTarget(event.target)) {
                        return;
                    }
                    openModal(card);
                });
            });

            applyFilters();
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init, {once: true});
        } else {
            init();
        }
    })();
</script>
</body>
</html>
