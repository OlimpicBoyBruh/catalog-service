<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: base(~{::title}, ~{::section})}">
<head>
    <title>Каталог устройств</title>
</head>
<body>
<section class="page-section">
    <div class="section-header">
        <div>
            <p class="eyebrow">Добро пожаловать</p>
            <h1>Организации</h1>
        </div>
        <div class="section-actions">
            <span class="hint">Всего: <strong th:text="${organizations.size()}">0</strong></span>
        </div>
    </div>

    <div class="grid" th:if="${organizations != null and !organizations.isEmpty()}">
        <article class="card organization-card" th:each="org : ${organizations}">
            <div class="card-header">
                <h2 th:text="${org.name}">Название</h2>
                <span class="pill"
                      th:text="${org.createdAt != null ? #temporals.format(org.createdAt, 'dd.MM.yyyy') : '—'}">01.01.2024</span>
            </div>
            <p class="muted" th:text="${org.description != null ? org.description : 'Описание отсутствует'}"></p>
            <div class="card-footer">
                <a class="btn primary" th:href="@{'/organizations/' + ${org.id}}">Открыть</a>
            </div>
        </article>
    </div>
    <div class="empty-state" th:if="${organizations == null or organizations.isEmpty()}">
        <p>Пока нет ни одной организации. Создайте первую, чтобы начать работать с каталогом устройств и витрин.</p>
    </div>
</section>

<section class="page-section">
    <div class="form-card">
        <h2>Создать организацию</h2>
        <form th:action="@{/organizations}" th:object="${organizationForm}" method="post" class="form-grid">
            <label>
                Название
                <input type="text" th:field="*{name}" placeholder="ООО «Витрина»" required/>
            </label>
            <label class="full-width">
                Описание
                <textarea th:field="*{description}" placeholder="Кратко опишите организацию"></textarea>
            </label>
            <div class="full-width form-actions">
                <button class="btn primary" type="submit">Создать</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
