<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: base(~{::title}, ~{::section})}">
<head>
    <title>Каталог продуктов</title>
</head>
<body>
<section class="page-section">
    <div class="section-header">
        <div>
            <p class="eyebrow">Добро пожаловать</p>
            <h1>Шаблоны</h1>
        </div>
        <div class="section-actions">
            <span class="hint">Всего: <strong th:text="${template.size()}">0</strong></span>
            <button class="btn primary" id="show-template-form">Создать шаблон</button>
        </div>
    </div>

    <div class="grid" th:if="${template != null and !template.isEmpty()}">
        <article class="card template-card" th:each="org : ${template}">
            <div class="card-header">
                <h2 th:text="${org.name}">Название</h2>
                <span class="pill"
                      th:text="${org.createdAt != null ? #temporals.format(org.createdAt, 'dd.MM.yyyy') : '—'}">01.01.2024</span>
            </div>
            <p class="muted" th:text="${org.description != null ? org.description : 'Описание отсутствует'}"></p>
            <div class="card-footer">
                <a class="btn primary" th:href="@{'/template/' + ${org.id}}">Открыть</a>
            </div>
        </article>
    </div>
    <div class="empty-state" th:if="${template == null or template.isEmpty()}">
        <p>Пока нет ни одного шаблона. Создайте первый шаблон, чтобы начать работать с каталогом продуктов и витрин.</p>
    </div>

    <!-- Форма создания шаблона -->
    <div class="page-section" id="template-form-section" style="display: none;">
        <div class="form-card">
            <h2>Создать шаблон</h2>
            <form th:action="@{/template}" th:object="${templateForm}" method="post" class="form-grid">
                <label>
                    Название
                    <input type="text" th:field="*{name}" placeholder="«Витрина»" required/>
                </label>
                <label class="full-width">
                    Описание
                    <textarea th:field="*{description}" placeholder="Кратко опишите содержание"></textarea>
                </label>
                <div class="full-width form-actions">
                    <button class="btn primary" type="submit">Создать шаблон</button>
                    <button class="btn secondary" type="button" id="hide-template-form">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript внутри секции -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded - initializing template form');

            const showButton = document.getElementById('show-template-form');
            const hideButton = document.getElementById('hide-template-form');
            const formSection = document.getElementById('template-form-section');

            console.log('Elements found:', {
                showButton: !!showButton,
                hideButton: !!hideButton,
                formSection: !!formSection
            });

            if (showButton && formSection) {
                showButton.addEventListener('click', function() {
                    console.log('Show button clicked');
                    formSection.style.display = 'block';
                    // Прокручиваем к форме
                    formSection.scrollIntoView({ behavior: 'smooth' });
                });
            }

            if (hideButton && formSection) {
                hideButton.addEventListener('click', function() {
                    console.log('Hide button clicked');
                    formSection.style.display = 'none';
                });
            }
        });
    </script>
</section>
</body>
</html>
